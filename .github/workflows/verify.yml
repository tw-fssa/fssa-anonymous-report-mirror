name: Verify transparency log

# Runs on every push (including the hourly commits from the fssh-mirror-push Cloudflare Worker).
# Needs no secrets and no network: it recomputes the Merkle roots from the mirrored entries, checks every
# consistency proof, and checks that nothing already mirrored was modified or deleted since the previous push.
# The Worker's GitHub token has no Workflows permission, so it cannot change or disable this check.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mirror with history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Verify entries, roots, proofs and append-only history
        env:
          BEFORE: ${{ github.event.before }}
        run: node scripts/verify.mjs "$BEFORE"
