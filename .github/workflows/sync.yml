name: Sync public transparency log

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync.yml"
      - "scripts/sync.mjs"

permissions:
  contents: write

concurrency:
  group: sync-public-transparency-log
  cancel-in-progress: false

env:
  SOURCE_API: "https://report.fssakh.org"
  # Runners are outside Taiwan; the edge lets this key past its non-TW challenge for /api/health and /log/*.
  MIRROR_SYNC_KEY: ${{ secrets.FSSH_MIRROR_SYNC_KEY }}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mirror
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Probe public Worker health
        run: node -e "const r = await fetch(process.env.SOURCE_API + '/api/health', { headers: { 'x-fssh-mirror-key': process.env.MIRROR_SYNC_KEY || '' } }); if (!r.ok) throw new Error(r.status + ' ' + (await r.text()).slice(0, 300)); console.log(await r.text());"

      - name: Sync from public Worker API
        run: node scripts/sync.mjs

      - name: Commit mirror update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json entries roots proofs snapshots keys README.md
          if git diff --cached --quiet; then
            echo "No mirror changes to commit."
          else
            git commit -m "chore: sync public transparency log"
            git push
          fi
